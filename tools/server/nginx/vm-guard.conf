# VM guard — правила внутри каждого server { } (FastPanel подключает
# /etc/nginx/fastpanel2-includes/*.conf во все сайты).
# Переменные задаются в /etc/nginx/conf.d/01-vm-guard.conf.

if ($vm_bot_state = fake) {
    return 444;
}
if ($vm_bare_referer = 1) {
    return 444;
}

limit_conn vm_backend 20;
limit_req zone=vm_unverified_bot burst=30 nodelay;
