# /etc/nginx/fastpanel2-includes/00-block-dotgit.conf (s3, 2026-11-13)
# Каталоги VCS лежат в корнях сайтов; наружу не отдаём.
# Запросы пишутся в access log: по ним fail2ban (nginx-exploit-scan) банит сканер.
location ^~ /.git {
    return 404;
}
location ^~ /.svn {
    return 404;
}
location ^~ /.hg {
    return 404;
}
