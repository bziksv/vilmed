# VM guard — общая защита всех сайтов сервера (http { }).
# Ставится в /etc/nginx/conf.d/01-vm-guard.conf.
# Списки в /etc/nginx/vm-bots/ пишет /usr/local/sbin/vm-bot-verify.py (cron).
# Правила уровня server { } — /etc/nginx/fastpanel2-includes/vm-guard.conf.

# Называет себя поисковым роботом (Яндекс, Google, Bing, Mail.ru).
map $http_user_agent $vm_claims_bot {
    default 0;
    "~*(yandex\.com/bots|Googlebot|Google-InspectionTool|Storebot-Google|AdsBot-Google|GoogleOther|Mediapartners-Google|APIs-Google|FeedFetcher-Google|bingbot|BingPreview|msnbot|adidxbot|Mail\.RU_Bot)" 1;
}

# Адрес подтверждён: обратный DNS + прямой DNS, либо официальные диапазоны Google/Bing.
geo $vm_verified_ip {
    default 0;
    include /etc/nginx/vm-bots/official.geo;
    include /etc/nginx/vm-bots/verified.geo;
}

# Называл себя роботом, а DNS не совпал.
geo $vm_fake_ip {
    default 0;
    include /etc/nginx/vm-bots/fake.geo;
}

# verified — настоящий робот; fake — подделка; unverified — ещё не проверен; none — не робот.
map "$vm_claims_bot$vm_verified_ip$vm_fake_ip" $vm_bot_state {
    default    none;
    "~^11"     verified;
    "101"      fake;
    "100"      unverified;
}

map $vm_bot_state $vm_search_engine {
    default  0;
    verified 1;
}

# Непроверенный робот: не больше 10 страниц в секунду с одного адреса.
map $vm_bot_state $vm_unverified_key {
    default    "";
    unverified $binary_remote_addr;
}
limit_req_zone $vm_unverified_key zone=vm_unverified_bot:10m rate=10r/s;

# Реферер ровно «https://сайт» без слеша: браузер так не присылает.
map "$http_referer|$host" $vm_bare_referer {
    default 0;
    "~^https?://([^/|]+)\|\1$" 1;
}

# Одновременные запросы к PHP на сайт. Статика и /bitrix/admin/ не считаются.
map $uri $vm_dyn_uri {
    default 1;
    "~*\.(jpe?g|gif|png|svg|webp|avif|ico|css|js|map|woff2?|ttf|otf|eot|mp3|mp4|ogg|pdf|zip|txt)$" 0;
    "~^/bitrix/admin/" 0;
}
map $vm_dyn_uri $vm_backend_key {
    default "";
    1       $host;
}
limit_conn_zone $vm_backend_key zone=vm_backend:10m;

# Россия и соседние страны (DB-IP, обновляется раз в месяц).
geo $vm_geo_local {
    ranges;
    default 0;
    include /etc/nginx/vm-bots/local-country.geo;
}
