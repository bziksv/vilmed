# /etc/ssh/sshd_config.d/00-vm-hardening.conf (2026-11-11)
# Подключается раньше основных строк sshd_config, поэтому побеждает.
# Входов по паролю в журнале с 23.10 не было: только publickey root.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
# Было 0 (без ограничения): подборщики висели на входе и занимали очередь MaxStartups.
LoginGraceTime 20
MaxAuthTries 3
MaxStartups 30:50:200
X11Forwarding no
